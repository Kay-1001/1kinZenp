<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1c1916">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="GPTBot" content="noindex, nofollow">
<meta name="ClaudeBot" content="noindex, nofollow">
<title>「T」用語彙 100問</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f1e8;
    --paper-warm: #ebe5d6;
    --ink: #1c1916;
    --ink-soft: #3a3530;
    --muted: #6b6456;
    --rule: #d4cdba;
    --rule-soft: #e3ddcc;
    --accent: #8b2332;
    --accent-soft: #a84658;
    --correct: #2f5d2f;
    --correct-soft: #d9e5d5;
    --wrong: #8b2332;
    --wrong-soft: #ead5d8;
    --shadow: 0 1px 2px rgba(28,25,22,.04), 0 4px 16px rgba(28,25,22,.06);
    --serif-en: 'Fraunces', 'Noto Serif JP', Georgia, serif;
    --serif-jp: 'Noto Serif JP', 'Yu Mincho', serif;
    --sans-jp: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans-jp);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
  }

  body {
    background-image:
      radial-gradient(circle at 20% 10%, rgba(139,35,50,.03), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(47,93,47,.03), transparent 40%);
  }

  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 80px;
    min-height: 100vh;
  }

  /* === HEADER === */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 16px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--rule);
  }

  .brand {
    font-family: var(--serif-en);
    font-weight: 500;
    font-style: italic;
    font-size: 1.1rem;
    letter-spacing: .02em;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .brand-session {
    display: inline-block;
    padding: 3px 10px 4px;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--serif-jp);
    font-size: .78rem;
    font-style: normal;
    font-weight: 500;
    letter-spacing: .08em;
    line-height: 1;
    vertical-align: 2px;
  }

  .brand-main {
    font-family: var(--serif-en);
    font-style: italic;
    font-weight: 500;
  }

  .brand-sub {
    font-family: var(--sans-jp);
    font-size: .75rem;
    color: var(--muted);
    font-style: normal;
    letter-spacing: .05em;
  }

  @media (max-width: 520px) {
    .brand { font-size: .95rem; gap: 8px; }
    .brand-session { font-size: .72rem; padding: 2px 8px 3px; }
  }

  .meta {
    font-family: var(--serif-en);
    font-size: .85rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* === PROGRESS BAR === */
  .progress-wrap {
    margin-bottom: 32px;
  }

  .progress-bar {
    height: 3px;
    background: var(--rule-soft);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--ink);
    transition: width .4s cubic-bezier(.4,0,.2,1);
  }

  .progress-stats {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-family: var(--serif-en);
    font-size: .8rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .progress-stats strong {
    color: var(--ink);
    font-weight: 500;
  }

  /* === START SCREEN === */
  .start {
    padding: 40px 0;
    text-align: left;
  }

  .start-eyebrow {
    font-family: var(--serif-en);
    font-style: italic;
    font-size: 1rem;
    color: var(--accent);
    margin-bottom: 8px;
    letter-spacing: .02em;
  }

  .start-title {
    font-family: var(--serif-jp);
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 4px;
    letter-spacing: -.01em;
  }

  .start-title-en {
    font-family: var(--serif-en);
    font-size: clamp(1.3rem, 4vw, 1.8rem);
    font-weight: 400;
    font-style: italic;
    color: var(--ink-soft);
    margin-bottom: 28px;
    letter-spacing: -.01em;
  }

  .start-desc {
    font-size: .95rem;
    color: var(--ink-soft);
    max-width: 540px;
    margin-bottom: 32px;
    line-height: 1.75;
  }

  .start-specs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    margin-bottom: 40px;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }

  .spec {
    padding: 16px 14px;
    border-right: 1px solid var(--rule);
  }
  .spec:last-child { border-right: none; }

  .spec-label {
    font-family: var(--serif-en);
    font-style: italic;
    font-size: .7rem;
    color: var(--muted);
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .spec-value {
    font-family: var(--serif-en);
    font-size: 1.4rem;
    font-weight: 500;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    font-family: var(--sans-jp);
    font-size: 1rem;
    font-weight: 500;
    background: var(--ink);
    color: var(--paper);
    border: none;
    cursor: pointer;
    letter-spacing: .02em;
    transition: transform .15s, background .15s;
  }

  .btn:hover { background: var(--ink-soft); }
  .btn:active { transform: translateY(1px); }

  .btn-ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
    padding: 13px 27px;
  }
  .btn-ghost:hover { background: var(--ink); color: var(--paper); }

  .btn-arrow {
    font-family: var(--serif-en);
    font-style: italic;
    font-size: 1.05rem;
  }

  .btn-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 24px;
  }

  .resume-note {
    background: var(--paper-warm);
    padding: 14px 16px;
    margin-bottom: 20px;
    font-size: .85rem;
    color: var(--ink-soft);
    border-left: 3px solid var(--accent);
    line-height: 1.7;
  }

  /* === NAME FORM === */
  .name-form {
    margin-bottom: 28px;
    padding: 20px 22px;
    background: rgba(255,255,255,.4);
    border: 1px solid var(--rule);
  }

  .name-field {
    margin-bottom: 14px;
  }
  .name-field:last-of-type { margin-bottom: 0; }

  .name-label {
    display: block;
    font-family: var(--serif-en);
    font-style: italic;
    font-size: .78rem;
    color: var(--muted);
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .name-label .jp {
    font-family: var(--sans-jp);
    font-style: normal;
    font-size: .72rem;
    color: var(--ink-soft);
    margin-left: 8px;
    letter-spacing: .02em;
    text-transform: none;
  }

  .name-input {
    width: 100%;
    padding: 11px 14px;
    font-family: var(--sans-jp);
    font-size: 1rem;
    background: var(--paper);
    border: 1px solid var(--rule);
    color: var(--ink);
    transition: border-color .15s, background .15s;
    border-radius: 0;
  }

  .name-input:focus {
    outline: none;
    border-color: var(--ink);
    background: #fff;
  }

  .name-error {
    font-family: var(--sans-jp);
    font-size: .82rem;
    color: var(--wrong);
    margin-top: 10px;
    min-height: 1em;
    font-weight: 500;
  }

  /* === STUDENT BANNER (Result Screen) === */
  .student-banner {
    padding: 16px 20px;
    margin-bottom: 28px;
    background: var(--ink);
    color: var(--paper);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .student-name-jp {
    font-family: var(--serif-en);
    font-style: italic;
    font-size: .7rem;
    color: var(--paper);
    opacity: .65;
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-right: 10px;
  }

  .student-name {
    font-family: var(--serif-jp);
    font-size: 1.2rem;
    color: var(--paper);
    font-weight: 500;
    letter-spacing: .01em;
  }

  .student-id {
    font-family: var(--serif-en);
    font-size: .95rem;
    color: var(--paper);
    opacity: .75;
    font-variant-numeric: tabular-nums;
  }

  .student-datetime {
    font-family: var(--serif-en);
    font-size: .85rem;
    color: var(--paper);
    opacity: .7;
    font-variant-numeric: tabular-nums;
    font-style: italic;
  }

  @media (max-width: 520px) {
    .student-banner {
      padding: 14px 16px;
      gap: 8px;
      flex-direction: column;
      align-items: flex-start;
    }
    .student-name { font-size: 1.05rem; }
    .student-datetime { font-size: .8rem; }
  }

  /* === SUBMIT NOTICE === */
  .submit-notice {
    padding: 16px 20px;
    margin-bottom: 32px;
    background: #fffaf0;
    border: 2px solid var(--accent);
    border-left-width: 6px;
  }

  .submit-notice-label {
    font-family: var(--serif-en);
    font-style: italic;
    font-size: .72rem;
    color: var(--accent);
    letter-spacing: .1em;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 8px;
  }

  .submit-notice-body {
    font-family: var(--sans-jp);
    font-size: .92rem;
    color: var(--ink);
    line-height: 1.75;
  }

  .submit-notice-body strong {
    color: var(--ink);
    font-weight: 700;
    font-size: 1rem;
  }

  .submit-notice-caution {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--rule);
    font-size: .82rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  .submit-notice-caution u {
    text-decoration: underline;
    text-decoration-color: var(--accent);
    text-underline-offset: 3px;
    font-weight: 500;
  }

  @media (max-width: 520px) {
    .submit-notice { padding: 14px 16px; }
    .submit-notice-body { font-size: .88rem; }
    .submit-notice-body strong { font-size: .95rem; }
    .submit-notice-caution { font-size: .78rem; }
  }

  /* === QUIZ SCREEN === */
  .question-num {
    font-family: var(--serif-en);
    font-style: italic;
    font-size: .85rem;
    color: var(--muted);
    letter-spacing: .05em;
    margin-bottom: 12px;
  }

  .question-num::before {
    content: "—— ";
    color: var(--rule);
  }

  .question {
    font-family: var(--serif-en);
    font-size: clamp(1.15rem, 3.5vw, 1.4rem);
    line-height: 1.6;
    margin-bottom: 28px;
    color: var(--ink);
    font-weight: 400;
    letter-spacing: -.005em;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 24px;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 18px;
    background: transparent;
    border: 1px solid var(--rule);
    text-align: left;
    cursor: pointer;
    font-family: var(--serif-en);
    font-size: 1.02rem;
    color: var(--ink);
    transition: all .15s;
    width: 100%;
    line-height: 1.4;
  }

  .option:hover:not(:disabled) {
    border-color: var(--ink);
    background: var(--paper-warm);
  }

  .option:disabled { cursor: default; }

  .option-letter {
    font-family: var(--serif-en);
    font-style: italic;
    font-weight: 500;
    color: var(--muted);
    min-width: 20px;
    flex-shrink: 0;
  }

  .option-text {
    flex: 1;
  }

  .option.correct {
    border-color: var(--correct);
    background: var(--correct-soft);
    color: var(--correct);
  }
  .option.correct .option-letter { color: var(--correct); }

  .option.wrong {
    border-color: var(--wrong);
    background: var(--wrong-soft);
    color: var(--wrong);
  }
  .option.wrong .option-letter { color: var(--wrong); }

  .option.dimmed {
    opacity: .55;
  }

  /* === FEEDBACK === */
  .feedback {
    margin-top: 8px;
    padding: 20px 22px;
    border-left: 3px solid var(--ink);
    background: var(--paper-warm);
    animation: slideIn .3s ease-out;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .feedback.correct { border-left-color: var(--correct); }
  .feedback.wrong { border-left-color: var(--wrong); }

  .feedback-verdict {
    font-family: var(--serif-en);
    font-style: italic;
    font-size: 1rem;
    font-weight: 500;
    margin-bottom: 10px;
    letter-spacing: .02em;
  }

  .feedback.correct .feedback-verdict { color: var(--correct); }
  .feedback.wrong .feedback-verdict { color: var(--wrong); }

  .feedback-verdict-jp {
    font-family: var(--sans-jp);
    font-size: .75rem;
    font-weight: 500;
    font-style: normal;
    color: var(--muted);
    margin-left: 8px;
    letter-spacing: .05em;
  }

  .feedback-body {
    font-size: .92rem;
    line-height: 1.75;
    color: var(--ink-soft);
  }

  .feedback-sentence {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    margin-bottom: 14px;
    background: rgba(47,93,47,.06);
    border: 1px solid rgba(47,93,47,.15);
    font-family: var(--serif-en);
    font-size: .98rem;
    line-height: 1.55;
    color: var(--correct);
  }

  .feedback-sentence.wrong-sentence {
    background: rgba(139,35,50,.04);
    border-color: rgba(139,35,50,.12);
    color: var(--ink-soft);
  }

  .feedback-sentence-text {
    flex: 1;
    font-style: italic;
  }

  /* feedback-sentence 内の下線語は文の色（緑/赤）に合わせる */
  .feedback-sentence .clickable-word {
    color: inherit;
    border-bottom: 1px dotted currentColor;
    opacity: .92;
  }
  .feedback-sentence .clickable-word:hover,
  .feedback-sentence .clickable-word:active {
    background-color: rgba(0,0,0,.08);
    opacity: 1;
  }
  .feedback-sentence .clickable-word.active {
    background-color: rgba(0,0,0,.15);
  }

  .accent-btns {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    align-items: center;
  }

  .accent-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    background: var(--correct);
    color: var(--paper);
    border: none;
    cursor: pointer;
    font-size: .72rem;
    font-family: var(--sans-jp);
    font-weight: 500;
    letter-spacing: .03em;
    transition: transform .12s, opacity .12s;
    white-space: nowrap;
  }

  .accent-btn:hover { opacity: .85; }
  .accent-btn:active { transform: scale(.93); }

  .accent-label {
    font-family: var(--serif-en);
    font-style: italic;
    font-size: .7rem;
  }

  .wrong-sentence .accent-btn {
    background: var(--muted);
  }

  @media (max-width: 520px) {
    .feedback-sentence { font-size: .9rem; padding: 8px 12px; flex-wrap: wrap; }
    .accent-btns { margin-top: 6px; }
    .accent-btn { padding: 4px 8px; font-size: .68rem; }
  }

  .feedback-correct-answer {
    font-family: var(--serif-en);
    color: var(--ink);
    font-weight: 500;
    font-style: italic;
  }

  /* === NAV === */
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
    gap: 12px;
  }

  .nav-quit {
    font-family: var(--serif-en);
    font-style: italic;
    font-size: .85rem;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px 4px;
    text-decoration: underline;
    text-decoration-color: var(--rule);
    text-underline-offset: 4px;
  }
  .nav-quit:hover { color: var(--ink); }

  /* === RESULTS === */
  .results {
    padding: 20px 0;
  }

  .results-eyebrow {
    font-family: var(--serif-en);
    font-style: italic;
    color: var(--accent);
    font-size: 1rem;
    margin-bottom: 8px;
  }

  .results-title {
    font-family: var(--serif-jp);
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    font-weight: 700;
    margin-bottom: 32px;
    line-height: 1.25;
  }

  .score-display {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 8px;
  }

  .score-big {
    font-family: var(--serif-en);
    font-size: clamp(4rem, 14vw, 6rem);
    font-weight: 300;
    line-height: 1;
    color: var(--ink);
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }

  .score-big sup {
    font-size: .4em;
    font-style: italic;
    color: var(--muted);
    font-weight: 400;
    margin-left: 4px;
  }

  .score-label {
    font-family: var(--serif-en);
    font-style: italic;
    color: var(--muted);
    font-size: 1rem;
  }

  .score-breakdown {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    margin: 32px 0;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }

  .score-cell {
    padding: 16px 12px;
    border-right: 1px solid var(--rule);
  }
  .score-cell:last-child { border-right: none; }

  .score-cell-label {
    font-family: var(--serif-en);
    font-style: italic;
    font-size: .7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 4px;
  }

  .score-cell-value {
    font-family: var(--serif-en);
    font-size: 1.4rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .score-cell.correct .score-cell-value { color: var(--correct); }
  .score-cell.wrong .score-cell-value { color: var(--wrong); }

  .results-msg {
    font-family: var(--serif-en);
    font-style: italic;
    font-size: 1.1rem;
    color: var(--ink-soft);
    margin-bottom: 32px;
    line-height: 1.6;
  }

  /* === REVIEW LIST === */
  .review-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--rule);
  }

  .review-title {
    font-family: var(--serif-en);
    font-style: italic;
    font-size: 1.1rem;
    color: var(--ink);
  }

  .review-title-jp {
    font-family: var(--sans-jp);
    font-size: .8rem;
    color: var(--muted);
    margin-left: 8px;
    letter-spacing: .05em;
  }

  .review-count {
    font-family: var(--serif-en);
    font-size: .85rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* === UTILITIES === */
  .hidden { display: none !important; }

  .footer {
    margin-top: 60px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
    text-align: center;
    font-family: var(--serif-en);
    font-style: italic;
    font-size: .75rem;
    color: var(--muted);
    letter-spacing: .03em;
  }

  /* Mobile tweaks */
  @media (max-width: 520px) {
    .app { padding: 20px 16px 60px; }
    .start-specs, .score-breakdown {
      grid-template-columns: repeat(3, 1fr);
    }
    .spec, .score-cell { padding: 12px 8px; }
    .spec-value, .score-cell-value { font-size: 1.15rem; }
    .question { font-size: 1.1rem; }
    .option { font-size: .98rem; padding: 12px 14px; }
    .btn { padding: 12px 22px; font-size: .95rem; }
  }

  /* Print-like paper texture subtle */
  .app::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(circle at 1px 1px, rgba(28,25,22,.015) 1px, transparent 0);
    background-size: 3px 3px;
    z-index: 0;
  }
  .app > * { position: relative; z-index: 1; }

  /* === Header right toolbar (rate selector + teacher badge) === */
  .header-right {

    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .rate-control {
    display: inline-flex;
    align-items: center;
    gap: 6px;

  .rate-control-label {

  @media (max-width: 520px) {

  .teacher-badge {

    font-style: italic;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    line-height: 1.1;
    vertical-align: middle;

    background: #fdf4ff;

    font-style: italic;
    font-weight: 500;
    letter-spacing: .02em;

    font-style: italic;

    color: var(--accent);

  .retry-banner-label {

    font-family: var(--serif-en);

    font-size: .72rem;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-right: 8px;

  /* === Start screen notes === */

    font-family: var(--serif-en);
    font-style: italic;

    margin-bottom: 4px;

  .start-notes .underline-demo {
    border-bottom: 1px dotted var(--accent);
    color: var(--accent);

  /* === Dictionary popup (clickable words) === */
  .clickable-word {

  .clickable-word.active {

  .target-blank-word {
    background: var(--ink);
    color: var(--paper);
    padding: 1px 6px;
    font-style: italic;
    font-weight: 500;
  }

  .word-popup {
    position: fixed;
    z-index: 200;
    background: var(--ink);
    color: var(--paper);
    padding: 12px 16px;
    min-width: 200px;
    max-width: 320px;
    box-shadow: 0 4px 20px rgba(0,0,0,.25);
    border: 1px solid var(--ink);

  }
  @keyframes popupFadeIn {
    from { opacity: 0; transform: translateY(-4px); }

  .word-popup-headword {
    font-family: var(--serif-en);
    font-size: 1.2rem;
    font-style: italic;
    font-weight: 500;
    color: var(--paper);
    margin-bottom: 4px;
  }
  .word-popup-meaning {
    font-family: var(--sans-jp);
    font-size: .9rem;
    color: var(--paper);
    line-height: 1.5;
    opacity: .95;
  }
  .word-popup-close {
    position: absolute;
    top: 6px;
    right: 8px;
    background: none;
    border: none;
    color: var(--paper);
    opacity: .6;
    cursor: pointer;
    font-family: var(--serif-en);
    font-size: 1.1rem;
    line-height: 1;
    padding: 2px 6px;

  .word-popup-close:hover { opacity: 1; }

  @media (max-width: 520px) {
    .word-popup {
      left: 12px !important;
      right: 12px !important;

const QUESTIONS = [];
const QUESTIONS_DATA = [{"q":"The hotel's spacious rooms are very _____, with soft beds and quiet air conditioning.","opts":["comfortable","comparable","considerable","countable"],"ans":1,"exp":"comfortable は「快適な」で寝具や空調の心地よさを述べる定型形容詞。comparable は「比較できる、同等の」、considerable は「かなりの、相当な」、countable は「数えられる」で意味が合わない。","sMatches":[{"start":4,"end":11,"term":"hotel's","meaning":"ホテル","original":"hotel's"},{"start":12,"end":20,"term":"spacious","meaning":"広々とした","original":"spacious"},{"start":21,"end":26,"term":"rooms","meaning":"部屋","original":"rooms"},{"start":54,"end":58,"term":"soft","meaning":"柔らかい","original":"soft"},{"start":59,"end":63,"term":"beds","meaning":"ベッド","original":"beds"},{"start":68,"end":73,"term":"quiet","meaning":"静かな","original":"quiet"},{"start":74,"end":90,"term":"air conditioning","meaning":"空調","original":"air conditioning"}]},{"q":"Police conducted a thorough _____ of the building after the alarm went off.","opts":["research","search","reach","sketch"],"ans":2,"exp":"conduct a search は「捜索を行う」の定型。research は「（学術的な）調査」で警察の捜索には合わない、reach は「到達」、sketch は「下絵、略図」で意味が合わない。","sMatches":[{"start":0,"end":6,"term":"police","meaning":"警察","original":"Police"},{"start":19,"end":27,"term":"thorough","meaning":"徹底的な","original":"thorough"},{"start":42,"end":50,"term":"building","meaning":"建物","original":"building"},{"start":61,"end":66,"term":"alarm","meaning":"警報","original":"alarm"},{"start":67,"end":75,"term":"went off","meaning":"鳴った","original":"went off"}]},{"q":"She studied _____ at art school and now takes photos for fashion magazines.","opts":["photograph","photographer","photography","photocopy"],"ans":3,"exp":"photography は「写真撮影（術）」で学問・技術として study の目的語になる不可算名詞。photograph は「（一枚の）写真」で可算、photographer は「写真家（人）」、photocopy は「コピー」で意味が合わない。","sMatches":[{"start":27,"end":37,"term":"art school","meaning":"美術学校","original":"art school"},{"start":46,"end":51,"term":"takes","meaning":"取る","original":"takes"},{"start":52,"end":58,"term":"photos","meaning":"写真（複数）","original":"photos"},{"start":63,"end":80,"term":"fashion magazines","meaning":"ファッション誌","original":"fashion magazines"}]},{"q":"The factory must _____ its machines regularly to prevent breakdowns.","opts":["remain","contain","obtain","maintain"],"ans":4,"exp":"maintain は「維持・整備する」で機械の保守を表す定型。remain は「〜のままである」で自動詞、contain は「含む」、obtain は「入手する」で意味が合わない。","sMatches":[{"start":4,"end":11,"term":"factory","meaning":"工場","original":"factory"},{"start":30,"end":38,"term":"machines","meaning":"機械","original":"machines"},{"start":39,"end":48,"term":"regularly","meaning":"定期的に","original":"regularly"},{"start":52,"end":70,"term":"prevent breakdowns","meaning":"故障を防ぐ","original":"prevent breakdowns"}]},{"q":"There is a growing _____ for electric cars in large cities.","opts":["command","comment","demand","content"],"ans":3,"exp":"demand for ～ は「～への需要」の定型。command は「命令」、comment は「論評」、content は「内容」で意味が合わない。","sMatches":[{"start":11,"end":18,"term":"growing","meaning":"高まる","original":"growing"},{"start":30,"end":43,"term":"electric cars","meaning":"電気自動車","original":"electric cars"},{"start":47,"end":52,"term":"large","meaning":"大きい","original":"large"},{"start":53,"end":59,"term":"cities","meaning":"都市・市","original":"cities"}]},{"q":"The new project will _____ several departments working closely together.","opts":["involve","evolve","resolve","revolve"],"ans":1,"exp":"involve は「（人・部署を）巻き込む、関与させる」の定型。evolve は「進化する」、resolve は「解決する」、revolve は「回転する」で意味が合わない。","sMatches":[{"start":4,"end":7,"term":"new","meaning":"新しい","original":"new"},{"start":8,"end":15,"term":"project","meaning":"計画・プロジェクト","original":"project"},{"start":29,"end":36,"term":"several","meaning":"いくつかの","original":"several"},{"start":37,"end":48,"term":"departments","meaning":"部署","original":"departments"},{"start":57,"end":64,"term":"closely","meaning":"密接に","original":"closely"}]},{"q":"The training program led to a significant _____ in customer satisfaction.","opts":["movement","agreement","employment","improvement"],"ans":4,"exp":"improvement in ～ は「～の向上・改善」の定型。movement は「動き」、agreement は「合意」、employment は「雇用」で意味が合わない。","sMatches":[{"start":4,"end":20,"term":"training program","meaning":"研修プログラム","original":"training program"},{"start":30,"end":41,"term":"significant","meaning":"重要な・大幅な","original":"significant"},{"start":57,"end":78,"term":"customer satisfaction","meaning":"顧客満足度","original":"customer satisfaction"}]},{"q":"Because of the storm, the company decided to _____ the outdoor ceremony.","opts":["propose","postpone","dispose","oppose"],"ans":2,"exp":"postpone は「延期する」で予定を後ろにずらす定型。propose は「提案する」、dispose は「処分する（dispose of）」、oppose は「反対する」で意味が合わない。","sMatches":[{"start":0,"end":10,"term":"because of","meaning":"～のために","original":"Because of"},{"start":15,"end":20,"term":"storm","meaning":"嵐","original":"storm"},{"start":26,"end":33,"term":"company","meaning":"会社","original":"company"},{"start":58,"end":74,"term":"outdoor ceremony","meaning":"屋外式典","original":"outdoor ceremony"}]},{"q":"The consultant will _____ us on how to reduce production costs.","opts":["advice","advise","devise","revise"],"ans":2,"exp":"advise ～ on … は「～に…について助言する」の定型動詞。advice は不可算名詞「助言」で動詞位置に置けない（give advice on ～ なら可）、devise は「考案する」、revise は「改訂する」で意味が合わない。","sMatches":[{"start":4,"end":14,"term":"consultant","meaning":"コンサルタント","original":"consultant"},{"start":40,"end":46,"term":"reduce","meaning":"減らす","original":"reduce"},{"start":47,"end":63,"term":"production costs","meaning":"製造コスト","original":"production costs"}]},{"q":"Visitors must _____ a permit before entering the construction site.","opts":["contain","maintain","retain","obtain"],"ans":4,"exp":"obtain a permit は「許可証を取得する」の定型。contain は「含む」、maintain は「維持する」、retain は「保持し続ける」で意味が合わない。","sMatches":[{"start":0,"end":8,"term":"visitors","meaning":"訪問者","original":"Visitors"},{"start":23,"end":29,"term":"permit","meaning":"許可証","original":"permit"},{"start":50,"end":67,"term":"construction site","meaning":"工事現場","original":"construction site"}]},{"q":"Please reply _____ if you wish to confirm your reservation today.","opts":["immediately","immediate","instant","intermediate"],"ans":1,"exp":"reply を修飾するので副詞 immediately「すぐに」が必要。immediate は形容詞「即座の」、instant は形容詞・名詞「即時の／瞬間」、intermediate は形容詞「中級の」で動詞を修飾できない。","sMatches":[{"start":7,"end":12,"term":"reply","meaning":"返信する","original":"reply"},{"start":32,"end":36,"term":"wish","meaning":"願う","original":"wish"},{"start":40,"end":47,"term":"confirm","meaning":"確認する","original":"confirm"},{"start":53,"end":64,"term":"reservation","meaning":"予約","original":"reservation"},{"start":65,"end":70,"term":"today","meaning":"今日","original":"today"}]},{"q":"All passengers must turn off their _____ devices during takeoff.","opts":["electrical","electricity","electronic","electric"],"ans":3,"exp":"electronic devices は、スマートフォンやノートPCなどの「電子機器」を指す定型で、機内アナウンスの文脈に最も適切。electrical は配線・電気設備など系統全体を指すとき（electrical wiring）、electric は「電気で動く」を表すとき（electric motor）に使い分ける。electricity は名詞「電気」で device を修飾できない。","sMatches":[{"start":4,"end":14,"term":"passengers","meaning":"乗客","original":"passengers"},{"start":46,"end":53,"term":"devices","meaning":"（電子）機器","original":"devices"},{"start":61,"end":68,"term":"takeoff","meaning":"離陸","original":"takeoff"}]},{"q":"The new manager is _____ qualified for this senior position.","opts":["high","height","highness","highly"],"ans":4,"exp":"形容詞 qualified を強める副詞 highly「高度に、非常に」が必要で highly qualified は定型。high は「高く（物理的）」、height は名詞「高さ」、highness は「殿下」で意味が合わない。","sMatches":[{"start":4,"end":7,"term":"new","meaning":"新しい","original":"new"},{"start":8,"end":15,"term":"manager","meaning":"管理者","original":"manager"},{"start":26,"end":35,"term":"qualified","meaning":"適任の","original":"qualified"},{"start":45,"end":60,"term":"senior position","meaning":"上級職","original":"senior position"}]},{"q":"The two companies signed a _____ worth ten million dollars.","opts":["meal","heal","deal","seal"],"ans":3,"exp":"sign a deal は「契約・取引を結ぶ」の定型。meal は「食事」、heal は「治す」、seal は「封印（する）」で意味が合わない。","sMatches":[{"start":8,"end":17,"term":"companies","meaning":"会社（複数）","original":"companies"},{"start":32,"end":37,"term":"worth","meaning":"～の価値がある","original":"worth"},{"start":38,"end":57,"term":"ten million dollars","meaning":"1000万ドル","original":"ten million dollars"}]},{"q":"I am writing _____ the invoice that you sent us last week.","opts":["regard","regarding","regards","regarded"],"ans":2,"exp":"regarding は「～に関して」の前置詞で名詞 the invoice を直接導く定型。regard は動詞・名詞、regards は「よろしく（結びの語）」、regarded は過去分詞で前置詞の働きをしない。","sMatches":[{"start":27,"end":34,"term":"invoice","meaning":"請求書","original":"invoice"},{"start":52,"end":61,"term":"last week","meaning":"先週","original":"last week"}]},{"q":"The survey will help us _____ which products are most popular.","opts":["determine","terminate","dominate","eliminate"],"ans":1,"exp":"determine は「特定する、見極める」で which 節を目的語に取る定型。terminate は「終了させる」、dominate は「支配する」、eliminate は「除去する」で意味が合わない。","sMatches":[{"start":4,"end":10,"term":"survey","meaning":"調査","original":"survey"},{"start":16,"end":20,"term":"help","meaning":"助ける・手伝う","original":"help"},{"start":40,"end":48,"term":"products","meaning":"製品","original":"products"},{"start":53,"end":65,"term":"most popular","meaning":"最も人気のある","original":"most popular"}]},{"q":"The hotel received a _____ about the noise from the nearby construction.","opts":["complaint","complain","compliment","complement"],"ans":1,"exp":"receive a complaint about ～ は「～について苦情を受ける」の定型。complain は動詞「苦情を言う」で receive の目的語にできない、compliment は「ほめ言葉」、complement は「補完物」で意味が合わない。","sMatches":[{"start":4,"end":9,"term":"hotel","meaning":"ホテル","original":"hotel"},{"start":41,"end":46,"term":"noise","meaning":"騒音","original":"noise"},{"start":56,"end":62,"term":"nearby","meaning":"近くの","original":"nearby"},{"start":63,"end":75,"term":"construction","meaning":"建設・工事","original":"construction"}]},{"q":"She was promoted to head of the marketing _____ last month.","opts":["decision","vision","division","revision"],"ans":   // ============================================================
  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

    return shuffleArray(Array.from({length: QUESTIONS.length}, (_, i) => i));

  function clearSave() {

    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(record)); } catch(e) {}
  }

  // ============================================================
  // Counters
  // ============================================================
  function countAnswered() { return state.answers.filter(a => a != null).length; }
  function countCorrect() { return state.answers.filter(a => a && a.correct).length; }
  function countWrong() { return state.answers.filter(a => a && !a.correct).length; }
  function isTeacher() {
    return state.studentId === TEACHER_ID && state.studentName === TEACHER_NAME;
  }

  // ============================================================
  // Render dispatcher
  // ============================================================
  function render() {
    if (typeof closePopup === 'function') closePopup();
    if (state.mode === 'start') renderStart();
    else if (state.mode === 'quiz') renderQuiz();
    else if (state.mode === 'result') renderResult();
    else if (state.mode === 'retry') renderRetry();
    window.scrollTo({top:0, behavior:'instant'});
  }

  // ============================================================
  // Header (with rate toggle and teacher badge)
  // ============================================================
  function renderHeader(showMeta) {
    const answered = countAnswered();
    const total = QUESTIONS.length;
    const correct = countCorrect();
    const percent = answered > 0 ? Math.round((correct / answered) * 100) : 0;
    const sessionLabel = `第${SESSION_NUMBER}回`;
    const showToolbar = state.mode !== 'start';
    return `
      <div class="header">
        <div class="brand">
          <span class="brand-session">${sessionLabel}</span>
          <span class="brand-main">「T」用語彙</span>
          ${SESSION_TITLE ? `<span class="brand-sub">${escapeHtml(SESSION_TITLE)}</span>` : ''}
          ${isTeacher() ? '<span class="teacher-badge">✨ Teacher</span>' : ''}
        </div>
        <div class="header-right">
          ${showMeta ? `<div class="meta">${answered}/${total} · ${percent}%</div>` : ''}
          ${showToolbar ? `
            <div class="rate-control">
              <span class="rate-control-label">音声速度</span>
              <div class="rate-segment">
                <button class="rate-segment-btn ${state.rateMode === 'normal' ? 'active' : ''}" data-action="set-rate-normal">速い</button>
                <button class="rate-segment-btn ${state.rateMode === 'slow' ? 'active' : ''}" data-action="set-rate-slow">ゆっくり</button>
              </div>
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }

  // ============================================================
  // Progress bar
  // ============================================================
  function renderProgress() {
    const answered = countAnswered();
    const total = QUESTIONS.length;
    const correct = countCorrect();
    const wrong = countWrong();
    const percent = (answered / total) * 100;
    return `
      <div class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill" style="width:${percent}%"></div>
        </div>
        <div class="progress-stats">
          <span>Q.${state.index + 1} <strong>/ ${total}</strong></span>
          <span>正答 <strong>${correct}</strong> · 誤答 <strong>${wrong}</strong></span>
        </div>
      </div>
    `;
  }

  function renderRetryProgress() {
    const total = state.retryList.length;
    const answered = state.retryAnswers.filter(a => a != null).length;
    const correct = state.retryAnswers.filter(a => a && a.correct).length;
    const wrong = state.retryAnswers.filter(a => a && !a.correct).length;
    const percent = (answered / total) * 100;
    return `
      <div class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill" style="width:${percent}%"></div>
        </div>
        <div class="progress-stats">
          <span>Q.${state.retryIndex + 1} <strong>/ ${total}</strong></span>
          <span>正答 <strong>${correct}</strong> · 誤答 <strong>${wrong}</strong></span>
        </div>
      </div>
    `;
  }

    const history = loadHistory();

    app.innerHTML = `
      ${renderHeader(false)}
      <div class="start">
        <div class="start-eyebrow">Practice Set · for Japanese Learners</div>
        <h1 class="start-title">「T」用語彙</h1>
        <div class="start-title-en">100 Questions for TOEIC Part 5</div>

        <div class="start-specs">
          <div class="spec">

            <div class="spec-value">100</div>

            <div class="spec-label">Format</div>
            <div class="spec-value">4 Choice</div>
          </div>
          <div class="spec">
            <div class="spec-label">Focus</div>
            <div class="spec-value">Part 5</div>
          </div>
        </div>

        ${hasSaved ? `

        <div class="name-form">

          </div>
          <div class="name-field">
            <label class="name-label" for="input-name">Student Name <span class="jp">氏名（必須）</span></label>
            <input type="text" id="input-name" class="name-input" placeholder="例：山田 太郎" value="${escapeHtml(saved && saved.studentName ? saved.studentName : '')}" autocomplete="name" required>
          </div>
          <div class="name-error" id="name-error"></div>
        </div>

        <div class="btn-row">
          ${hasSaved ? `
            <button class="btn" data-action="resume">
              続きから <span class="btn-arrow">→</span>
            </button>
            <button class="btn btn-ghost" data-action="restart">最初から</button>
          ` : `

            </button>
          `}

        <div class="start-notes">
          <div class="start-notes-label">Notes · 注意事項</div>
          <p>全 ${QUESTIONS.length} 問。途中で閉じても続きから再開できます。</p>
          <p>正解の例文中の<span class="underline-demo">下線の語</span>をタップすると、意味が表示されます。</p>
          <p>間違えた問題は最後にもう一度挑戦できます。</p>
          <p>すべて終わったら、結果画面のスクリーンショットを撮って先生に提出してください。</p>
        </div>

        <div class="footer">© Kaoruko Takechi 2026</div>
      </div>
    `;

    app.querySelectorAll('[data-action]').forEach(el => {
      el.addEventListener('click', () => {
        const act = el.dataset.action;
        const nameInput = document.getElementById('input-name');
        const idInput = document.getElementById('input-id');
        const errorEl = document.getElementById('name-error');
        const nameVal = nameInput ? nameInput.value.trim() : '';
        const idVal = idInput ? idInput.value.trim() : '';

        if (act === 'start' || act === 'restart') {
          if (!idVal) {
            if (errorEl) errorEl.textContent = '学籍番号を入力してください。';
            if (idInput) idInput.focus();
            return;
          }
          if (!nameVal) {
            if (errorEl) errorEl.textContent = '氏名を入力してください。';
            if (nameInput) nameInput.focus();
            return;
          }
          state.studentId = idVal;
          state.studentName = nameVal;
          state.completedAt = null;
          state.answers = new Array(QUESTIONS.length).fill(null);
          state.order = makeOrder();
          state.index = 0;
          state.answered = false;
          state.mode = 'quiz';
          state.retryList = [];
          state.retryAnswers = [];
          state.retryIndex = 0;
          state.retryCompletedAt = null;
          clearSave();
          save();
          render();
        } else if (act === 'resume') {
          if (!idVal) {
            if (errorEl) errorEl.textContent = '学籍番号を入力してください。';
            if (idInput) idInput.focus();
            return;
          }
          if (!nameVal) {
            if (errorEl) errorEl.textContent = '氏名を入力してください。';
            if (nameInput) nameInput.focus();
            return;
          }
          const s = load();
          state.studentId = idVal;
          state.studentName = nameVal;
          state.completedAt = s && s.completedAt ? s.completedAt : null;
          state.answers = s && s.answers && s.answers.length === QUESTIONS.length
            ? s.answers
            : new Array(QUESTIONS.length).fill(null);
          state.order = s && s.order && s.order.length === QUESTIONS.length
            ? s.order
            : makeOrder();
          state.index = s && typeof s.index === 'number' ? Math.min(s.index, QUESTIONS.length - 1) : 0;
          state.answered = state.answers[state.index] != null;
          state.rateMode = (s && s.rateMode) || 'normal';
          state.retryList = (s && s.retryList) || [];
          state.retryAnswers = (s && s.retryAnswers) || [];
          state.retryIndex = (s && typeof s.retryIndex === 'number') ? s.retryIndex : 0;
          state.retryCompletedAt = (s && s.retryCompletedAt) || null;
          // Resume to the appropriate phase
          if (s && s.mode === 'retry') {
            state.mode = 'retry';
          } else if (state.completedAt && countAnswered() === QUESTIONS.length) {
            state.mode = 'result';
          } else {
            state.mode = 'quiz';
          }
          save();
          render();
        }
      });
    });
  }

  // ============================================================
  // Quiz screen
  // ============================================================
  function currentQ() {
    return QUESTIONS[state.order[state.index]];
  }

  function renderQuiz() {
    if (!state.order || state.order.length !== QUESTIONS.length) {
      state.order = makeOrder();
      save();
    }
    const q = currentQ();
    const existing = state.answers[state.index];
    const answered = existing != null;
    state.answered = answered;

    app.innerHTML = `
      ${renderHeader(true)}
      ${renderProgress()}
      <div class="question-num">Question ${state.index + 1}</div>
      <div class="question">${escapeHtml(q.q)}</div>
      <div class="options">
        ${q.opts.map((opt, i) => {
          const num = i + 1;
          const letter = String.fromCharCode(65 + i);
          let cls = 'option';
          if (answered) {
            cls += ' dimmed';
            if (num === q.ans) cls = 'option correct';
            else if (num === existing.chosen) cls = 'option wrong';
          }
          return `
            <button class="${cls}" data-num="${num}" ${answered ? 'disabled' : ''}>
              <span class="option-letter">(${letter})</span>
              <span class="option-text">${escapeHtml(opt)}</span>
            </button>
          `;
        }).join('')}
      </div>
      ${(!answered && isTeacher()) ? renderTeacherHint(q) : ''}
      ${answered ? renderFeedback(q, existing) : ''}
      <div class="nav">
        <button class="nav-quit" data-action="quit">一時中断して最初に戻る</button>
        ${answered ? `
          <button class="btn" data-action="next">
            ${state.index === QUESTIONS.length - 1 ? '結果を見る' : '次の問題'} <span class="btn-arrow">→</span>
          </button>
        ` : ''}
      </div>
      <div class="footer">© Kaoruko Takechi 2026</div>
    `;

    bindCommonHandlers();
    app.querySelectorAll('.option:not([disabled])').forEach(el => {
      el.addEventListener('click', () => {
        const num = parseInt(el.dataset.num, 10);
        const correct = num === q.ans;
        state.answers[state.index] = { chosen: num, correct: correct };
        state.answered = true;
        save();
        render();
        // session5: 選択肢クリック時に正解例文をUS音声で自動再生
        const fullSentence = q.q.replace('_____', q.opts[q.ans - 1]);
        speakSentence(fullSentence, 'en-US');
      });
    });
    app.querySelectorAll('[data-action]').forEach(el => {
      el.addEventListener('click', () => {
        const act = el.dataset.action;
        if (act === 'next') {
          if (state.index === QUESTIONS.length - 1) {
            state.mode = 'result';
            recordHistoryIfNew();
          } else {
            state.index++;
            state.answered = state.answers[state.index] != null;
          }
          save();
          render();
        } else if (act === 'quit') {
          state.mode = 'start';
          render();
        }
      });
    });
  }

  function renderTeacherHint(q) {
    const letter = String.fromCharCode(64 + q.ans);
    const word = q.opts[q.ans - 1];
    return `<div class="teacher-hint">👁 Teacher view — Correct: (${letter}) <strong>${escapeHtml(word)}</strong></div>`;
  }

  // ============================================================
  // Feedback (after answer)
  // ============================================================
  function renderFeedback(q, ans) {
    const isCorrect = ans.correct;
    const letter = String.fromCharCode(64 + q.ans);
    const correctWord = q.opts[q.ans - 1];
    const fullSentence = q.q.replace(/_____/g, correctWord);
    return `
      <div class="feedback ${isCorrect ? 'correct' : 'wrong'}">
        <div class="feedback-verdict">
          ${isCorrect ? 'Correct' : 'Incorrect'}
          <span class="feedback-verdict-jp">${isCorrect ? '正解' : '不正解'} · 正答は (${letter}) <span class="feedback-correct-answer">${escapeHtml(correctWord)}</span></span>
        </div>
        <div class="feedback-sentence ${isCorrect ? '' : 'wrong-sentence'}">
          <span class="feedback-sentence-text">${renderTextWithMatches(fullSentence, q.sMatches || [])}</span>
          <div class="accent-btns">
            ${renderAccentButtons(fullSentence)}
          </div>
        </div>
        <div class="feedback-body">${escapeHtml(q.exp)}</div>
      </div>
    `;
  }

  // ============================================================
  // Speech (manual only, applies rateMode)
  // ============================================================
  const ACCENTS = [
    { code: 'en-US', label: 'US', flag: '🇺🇸' },
    { code: 'en-GB', label: 'UK', flag: '🇬🇧' },
  ];

  function getVoiceForAccent(accentCode) {
    const voices = window.speechSynthesis.getVoices();
    const code = accentCode.replace('_', '-');
    let v = voices.find(v => v.lang.replace('_', '-') === code);
    if (!v) v = voices.find(v => v.lang.replace('_', '-').startsWith(code));
    if (!v) v = voices.find(v => v.lang.startsWith('en'));
    return v || null;
  }

  function speakSentence(text, accentCode) {
    try {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      setTimeout(() => {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = accentCode || 'en-US';
        utterance.rate = state.rateMode === 'slow' ? 0.85 : 1.15;
        utterance.pitch = 1;
        const voice = getVoiceForAccent(accentCode || 'en-US');
        if (voice) utterance.voice = voice;
        window.speechSynthesis.speak(utterance);
      }, 100);
    } catch(e) {}
  }

  function renderAccentButtons(fullSentence) {
    const escaped = escapeHtml(fullSentence);
    return ACCENTS.map(a =>
      `<button class="accent-btn" data-speak="${escaped}" data-accent="${a.code}" title="${a.label} English">${a.flag}<span class="accent-label">${a.label}</span></button>`
    ).join('');
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
  }

  // ============================================================
  // Common bindings (rate toggle, accent buttons)
  // ============================================================
  function bindCommonHandlers() {
    app.querySelectorAll('.accent-btn').forEach(el => {
      el.addEventListener('click', () => {
        const text = el.dataset.speak;
        const accent = el.dataset.accent;
        if (text) speakSentence(text, accent);
      });
    });
    app.querySelectorAll('[data-action="set-rate-normal"]').forEach(el => {
      el.addEventListener('click', () => {
        if (state.rateMode !== 'normal') {
          state.rateMode = 'normal';
          save();
          render();
        }
      });
    });
    app.querySelectorAll('[data-action="set-rate-slow"]').forEach(el => {
      el.addEventListener('click', () => {
        if (state.rateMode !== 'slow') {
          state.rateMode = 'slow';
          save();
          render();
        }
      });
    });
    bindClickableWords();
  }

  // ============================================================
  // Result screen
  // ============================================================
  function recordHistoryIfNew() {
    if (state.completedAt) return;
    state.completedAt = new Date().toISOString();
    const correct = countCorrect();
    const total = QUESTIONS.length;
    const score = total > 0 ? Math.round((correct / total) * 100) : 0;
    saveHistory({
      score, correct, total,
      completedAt: state.completedAt,
      studentName: state.studentName,
      studentId: state.studentId,
    });
    save();
  }

  function renderResult() {
    if (!state.completedAt) recordHistoryIfNew();

    const answered = countAnswered();
    const correct = countCorrect();
    const wrong = answered - correct;
    const percent = answered > 0 ? Math.round((correct / answered) * 100) : 0;

    let msg = '';
    if (percent >= 90) msg = 'Excellent — 9割超え。この水準を維持。';
    else if (percent >= 75) msg = 'Strong — 安定した実力。誤答を見直して完璧に。';
    else if (percent >= 60) msg = 'Solid — 基礎は固まっている。弱点を潰していこう。';
    else if (percent >= 40) msg = 'Building — 復習モードで間違いを潰そう。';
    else msg = 'Starting out — まずは解説を読み込んで、再挑戦を。';

    const wrongPositions = state.answers
      .map((a, i) => (a && !a.correct) ? i : -1)
      .filter(i => i >= 0);

    const completedDate = new Date(state.completedAt);
    const completedStr = completedDate.toLocaleDateString('ja-JP', {
      year: 'numeric', month: 'long', day: 'numeric'
    });

    // Score comparison: compare current with previous history (excluding self)
    const history = loadHistory();
    let comparisonHtml = '';
    if (history && history.completedAt !== state.completedAt) {
      const delta = percent - history.score;
      let deltaClass = 'same';
      let deltaSign = '±';
      if (delta > 0) { deltaClass = 'up'; deltaSign = '+'; }
      else if (delta < 0) { deltaClass = 'down'; deltaSign = ''; }
      const prevDate = new Date(history.completedAt);
      const prevStr = prevDate.toLocaleDateString('ja-JP', {month: 'long', day: 'numeric'});
      comparisonHtml = `
        <div class="score-comparison">
          <div class="score-comparison-label">Compared to last attempt · 前回比較</div>
          <div class="score-comparison-row">
            <span>${prevStr}：<strong>${history.score}%</strong> (${history.correct}/${history.total})</span>
            <span>→</span>
            <span>今回：<strong>${percent}%</strong> (${correct}/${QUESTIONS.length})</span>
            <span class="score-delta ${deltaClass}">${deltaSign}${delta}pt</span>
          </div>
        </div>
      `;
    }

    app.innerHTML = `
      ${renderHeader(false)}
      <div class="student-banner">
        <div>
          <span class="student-name-jp">Student</span>
          <span class="student-name">${escapeHtml(state.studentName || '(名前未入力)')}</span>
          ${state.studentId ? `<span class="student-id"> · ${escapeHtml(state.studentId)}</span>` : ''}
        </div>
        <div class="student-datetime">${completedStr}</div>
      </div>

      <div class="submit-notice">
        <div class="submit-notice-label">Submission · 提出方法</div>
        <div class="submit-notice-body">
          <strong>この画面全体をスクリーンショットして、先生に提出してください。</strong><br>
          氏名・学籍番号・正答率・完了日時がこの1画面に収まっています。
          <div class="submit-notice-caution">※ 下の「間違いを再挑戦」を押すと別画面に移ります。スクリーンショットは<u>この画面</u>を撮ってください。</div>
        </div>
      </div>

      <div class="results">
        <div class="results-eyebrow">Result</div>
        <h1 class="results-title">お疲れさまでした。</h1>

        <div class="score-display">
          <div class="score-big">${percent}<sup>%</sup></div>
          <div class="score-label">accuracy</div>
        </div>

        <div class="score-breakdown">
          <div class="score-cell">
            <div class="score-cell-label">Answered</div>
            <div class="score-cell-value">${answered} / ${QUESTIONS.length}</div>
          </div>
          <div class="score-cell correct">
            <div class="score-cell-label">Correct</div>
            <div class="score-cell-value">${correct}</div>
          </div>
          <div class="score-cell wrong">
            <div class="score-cell-label">Wrong</div>
            <div class="score-cell-value">${wrong}</div>
          </div>
        </div>

        <p class="results-msg">${msg}</p>
        ${comparisonHtml}

        <div class="btn-row" style="margin-top:24px;">
          ${wrong > 0 ? `<button class="btn" data-action="retry-wrong">📝 間違えた ${wrong}問を再挑戦 <span class="btn-arrow">→</span></button>` : ''}
          <button class="btn btn-ghost" data-action="restart-all">🔄 最初から解き直す</button>
        </div>

        <div class="footer">© Kaoruko Takechi 2026</div>
      </div>
    `;

    bindCommonHandlers();
    app.querySelectorAll('[data-action]').forEach(el => {
      el.addEventListener('click', () => {
        const act = el.dataset.action;
        if (act === 'retry-wrong') {
          state.retryList = wrongPositions.slice();
          state.retryAnswers = new Array(state.retryList.length).fill(null);
          state.retryIndex = 0;
          state.retryCompletedAt = null;
          state.mode = 'retry';
          save();
          render();
        } else if (act === 'restart-all') {
          // Keep id/name. Reset everything else, re-shuffle.
          state.answers = new Array(QUESTIONS.length).fill(null);
          state.order = makeOrder();
          state.index = 0;
          state.answered = false;
          state.completedAt = null;
          state.retryList = [];
          state.retryAnswers = [];
          state.retryIndex = 0;
          state.retryCompletedAt = null;
          state.mode = 'quiz';
          save();
          render();
        }
      });
    });
  }

  // ============================================================
  // Retry mode (re-attempt wrong questions)
  // ============================================================
  function currentRetryQ() {
    const pos = state.retryList[state.retryIndex];
    return QUESTIONS[state.order[pos]];
  }

  function renderRetry() {
    if (state.retryList.length === 0) {
      state.mode = 'result';
      render();
      return;
    }
    const q = currentRetryQ();
    const total = state.retryList.length;
    const existing = state.retryAnswers[state.retryIndex];
    const answered = existing != null;
    const originalPos = state.retryList[state.retryIndex];

    app.innerHTML = `
      ${renderHeader(false)}
      <div class="retry-banner">
        <span class="retry-banner-label">Retry</span>
        <strong>間違えた${total}問の再挑戦中</strong> — もう一度解いて、定着を確認しよう。
      </div>
      ${renderRetryProgress()}
      <div class="question-num">Question ${originalPos + 1} (re-attempt)</div>
      <div class="question">${escapeHtml(q.q)}</div>
      <div class="options">
        ${q.opts.map((opt, i) => {
          const num = i + 1;
          const letter = String.fromCharCode(65 + i);
          let cls = 'option';
          if (answered) {
            cls += ' dimmed';
            if (num === q.ans) cls = 'option correct';
            else if (num === existing.chosen) cls = 'option wrong';
          }
          return `
            <button class="${cls}" data-num="${num}" ${answered ? 'disabled' : ''}>
              <span class="option-letter">(${letter})</span>
              <span class="option-text">${escapeHtml(opt)}</span>
            </button>
          `;
        }).join('')}
      </div>
      ${(!answered && isTeacher()) ? renderTeacherHint(q) : ''}
      ${answered ? renderFeedback(q, existing) : ''}
      <div class="nav">
        <button class="nav-quit" data-action="back-to-result">結果に戻る</button>
        ${answered ? `
          <button class="btn" data-action="retry-next">
            ${state.retryIndex === total - 1 ? '結果画面に戻る' : '次の問題'} <span class="btn-arrow">→</span>
          </button>
        ` : ''}
      </div>
      <div class="footer">© Kaoruko Takechi 2026</div>
    `;

    bindCommonHandlers();
    app.querySelectorAll('.option:not([disabled])').forEach(el => {
      el.addEventListener('click', () => {
        const num = parseInt(el.dataset.num, 10);
        const correct = num === q.ans;
        state.retryAnswers[state.retryIndex] = { chosen: num, correct: correct };
        save();
        render();
        // session5: 選択肢クリック時に正解例文をUS音声で自動再生
        const fullSentence = q.q.replace('_____', q.opts[q.ans - 1]);
        speakSentence(fullSentence, 'en-US');
      });
    });
    app.querySelectorAll('[data-action]').forEach(el => {
      el.addEventListener('click', () => {
        const act = el.dataset.action;
        if (act === 'retry-next') {
          if (state.retryIndex === state.retryList.length - 1) {
            // 再挑戦完了 → 初回結果画面に戻る（高専仕様：再挑戦は内部復習扱い、スコアには反映しない）
            state.mode = 'result';
          } else {
            state.retryIndex++;
          }
          save();
          render();
        } else if (act === 'back-to-result') {
          state.mode = 'result';
          render();
        }
      });
    });
  }


  // ============================================================
  // Dictionary popup: renderTextWithMatches
  // ============================================================
  // matches: [{start, end, term, meaning, original}] (sorted by start)
  // Returns HTML with clickable spans for matched words.
  function renderTextWithMatches(text, matches) {
    if (!matches || matches.length === 0) {
      return escapeHtml(text);
    }
    // Sort by start
    const sorted = matches.slice().sort((a, b) => a.start - b.start);
    let html = '';
    let cursor = 0;
    for (const m of sorted) {
      if (m.start < cursor) continue; // skip overlapping
      // Plain text before this match
      if (m.start > cursor) {
        html += escapeHtml(text.substring(cursor, m.start));
      }
      // Matched word as clickable
      const word = text.substring(m.start, m.end);
      const dataMeaning = escapeHtml(m.meaning).replace(/'/g, "&#39;");
      const dataTerm = escapeHtml(m.term).replace(/'/g, "&#39;");
      html += `<span class="clickable-word" data-term="${dataTerm}" data-meaning="${dataMeaning}">${escapeHtml(word)}</span>`;
      cursor = m.end;
    }
    // Trailing plain text
    if (cursor < text.length) {
      html += escapeHtml(text.substring(cursor));
    }
    return html;
  }

  // Popup management
  let activePopupEl = null;
  let activeWordEl = null;

  function closePopup() {
    if (activePopupEl) {
      activePopupEl.remove();
      activePopupEl = null;
    }
    if (activeWordEl) {
      activeWordEl.classList.remove('active');
      activeWordEl = null;
    }
    document.removeEventListener('click', onDocClickToClose, true);
    document.removeEventListener('keydown', onEscToClose);
  }

  function onDocClickToClose(e) {
    if (activePopupEl && !activePopupEl.contains(e.target) && !e.target.classList.contains('clickable-word')) {
      closePopup();
    }
  }

  function onEscToClose(e) {
    if (e.key === 'Escape') closePopup();
  }

  function showPopup(wordEl) {
    closePopup();
    const term = wordEl.dataset.term || '';
    const meaning = wordEl.dataset.meaning || '';
    if (!meaning) return;

    const popup = document.createElement('div');
    popup.className = 'word-popup';
    popup.innerHTML = `
      <button class="word-popup-close" type="button" aria-label="閉じる">×</button>
      <div class="word-popup-headword">${escapeHtml(term)}</div>
      <div class="word-popup-meaning">${escapeHtml(meaning)}</div>
    `;
    document.body.appendChild(popup);

    // Position below the word
    const rect = wordEl.getBoundingClientRect();
    const popupRect = popup.getBoundingClientRect();
    let left = rect.left;
    let top = rect.bottom + 6;
    // Adjust if overflowing right
    if (left + popupRect.width > window.innerWidth - 12) {
      left = Math.max(12, window.innerWidth - popupRect.width - 12);
    }
    // Adjust if overflowing bottom (show above)
    if (top + popupRect.height > window.innerHeight - 12) {
      top = Math.max(12, rect.top - popupRect.height - 6);
    }
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';

    activePopupEl = popup;
    activeWordEl = wordEl;
    wordEl.classList.add('active');

    popup.querySelector('.word-popup-close').addEventListener('click', (e) => {
      e.stopPropagation();
      closePopup();
    });

    // Use capture to catch clicks before they reach buttons
    setTimeout(() => {
      document.addEventListener('click', onDocClickToClose, true);
      document.addEventListener('keydown', onEscToClose);
    }, 0);
  }

  function bindClickableWords() {
    app.querySelectorAll('.clickable-word').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        showPopup(el);
      });
    });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }

  // ============================================================
  // Initialize
  // ============================================================
  function init() {
    state.answers = new Array(QUESTIONS.length).fill(null);
    render();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
